<body>

 <fieldset>

            <tr>

            </tr>
            <tr>
                <td><label for=""> Email</label></td>
                <td><input type="email"  required placeholder="Ex:mad@gmail.com" name="mail" id=""><br></td>
            </tr>
            <tr>
                <td> <label for=""> Password</label></td>
                <td><input type="password"  required name="" id=""><br></td>
            </tr>
            <tr>

            </tr>
            <tr>
                <td> <label for=""> DOB</label></td>
                <td><input type="date"required name="date" id=""><br></td>
            </tr>
            <tr>
                <td><label for=""> Gender</label></td>
                <td> <input type="radio" name="gender" id="Male">Male

                <input type="radio" name="gender" id="Custom">Custom</td><br>
            </tr>
            <tr> 
                <td><label for=""> Select counry</label></td>

                <option value="UK">Uk</option>
            </select> <br></td>
            </tr>
            <tr>
                <td><label for=""> Upload pictures</label></td>
                <td><input type="file" name="fILE" id=""><br></td>
            </tr>
        </table>
        <br>
        <input type="reset" name="reset" id="">
    </fieldset>
    
    <fieldset>
    <legend>Course Details</legend>
        <label for="">Select course</label><br>
    <select name="course" id="">
        <option value="python">Python full stack</option>
        <option value="java">Java full stack</option>
    </select><br>

    <label for="">Delivery Mode</label>

    <input type="radio" name="delivery" id="offline">OFFLINE
    <br>
    <label for="">Comments</label><br>
    <textarea name="comments" id="" cols="30" rows="5"></textarea>
    </fieldset><br>
    <input type="submit" name="" id="">
    <button> <a href="HTML.png">click here to view photo</a></button>

</form>
